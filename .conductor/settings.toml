"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Gitignored files copied from the main checkout into each new workspace. Setting this replaces
# Conductor's default `.env*` pattern, so it's listed explicitly. supabase/.temp holds what
# `supabase link` writes (the hosted project ref and connection metadata): link the main checkout
# once and every new workspace can `supabase db push` without relinking.
file_include_globs = """
.env*
supabase/.temp/**
"""

[scripts]
setup = "pnpm install"
# Every workspace shares one local Supabase stack (Docker), so only one dev server runs at a time.
run_mode = "nonconcurrent"

[scripts.run.dev]
available_in = ["local"]
command = "pnpm dev --port $CONDUCTOR_PORT"
default = true
icon = "play"
